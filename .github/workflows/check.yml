name: check
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Follow ci/result
        env:
          EVENT: ${{ github.event_name }}
        run: |
          delay=$(cat ci/delay 2>/dev/null || echo 0)
          result=$(cat ci/result 2>/dev/null || echo pass)
          sleep "$delay"
          if [ "$result" = fail ]; then exit 1; fi
          if [ "$result" = fail-in-queue ] && [ "$EVENT" = merge_group ]; then exit 1; fi
